<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08285c"/>
      <stop offset=".48" stop-color="#101b4f"/>
      <stop offset="1" stop-color="#361078"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21d4fd"/>
      <stop offset=".5" stop-color="#3676ff"/>
      <stop offset="1" stop-color="#a33cff"/>
    </linearGradient>
    <linearGradient id="letters" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#cfe1ff"/>
      <stop offset="1" stop-color="#c69cff"/>
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="100"
        fill="url(#bg)" stroke="#448fff" stroke-width="4"/>

  <ellipse cx="256" cy="260" rx="202" ry="105"
           fill="none" stroke="url(#orbit)" stroke-width="24"
           transform="rotate(-20 256 260)"/>

  <text x="256" y="326"
        text-anchor="middle"
        font-family="DejaVu Sans, sans-serif"
        font-size="210"
        font-weight="700"
        fill="url(#letters)">DV</text>
</svg>
